name: 'Gradle Wrapper Upgrade'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  upgrade-gradle-wrapper:
    runs-on: ubuntu-latest
    env:
      WRAPPER_UPGRADE_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global url."https://unused-username:${WRAPPER_UPGRADE_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '18'

      - name: Check for major version bump
        id: version-check
        run: |
          CURRENT=$(grep -oP 'gradle-\K[\d.]+(?=-bin)' gradle/wrapper/gradle-wrapper.properties)
          CURRENT_MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          LATEST=$(curl -s https://services.gradle.org/versions/current | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          LATEST_MAJOR=$(echo "$LATEST" | cut -d. -f1)
          echo "Current: $CURRENT (major $CURRENT_MAJOR), Latest: $LATEST (major $LATEST_MAJOR)"
          if [ "$LATEST_MAJOR" -gt "$CURRENT_MAJOR" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: major version bump ($CURRENT_MAJOR → $LATEST_MAJOR) requires manual migration."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete stale wrapper upgrade branches
        if: steps.version-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/sabith-th/ivy-wallet/branches?per_page=100" \
            --jq '.[].name | select(startswith("wrapperbot/"))' | \
            while IFS= read -r branch; do
              echo "Deleting stale branch: $branch"
              gh api --method DELETE "repos/sabith-th/ivy-wallet/git/refs/heads/$branch" || true
            done

      - name: Upgrade Gradle Wrapper
        if: steps.version-check.outputs.skip != 'true'
        run: ./gradlew upgradeGradleWrapperIvyWallet
