name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '18'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (release)
        run: ./gradlew lintRelease --no-configuration-cache

      - name: Upload Lint Release report to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-release-report.html
          path: build/reports/lint/lint.html

      - name: Report lint error count
        if: always()
        run: |
          # Report errors but don't fail — baseline has many pre-existing errors
          # from the original project that were never enforced (lint always crashed before).
          COUNT=$(grep -c 'severity="Error"' build/reports/lint/lint.xml 2>/dev/null || echo "0")
          echo "Lint errors found: $COUNT"